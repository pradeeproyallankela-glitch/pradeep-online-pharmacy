<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pradeep Online Pharmacy Management System</title>
<style>
:root{--bg:#f4f8f7;--card:#fff;--text:#16302b;--muted:#5d7571;--pri:#0f8b7a;--pri2:#0a6a5d;--bd:#d9e5e2;--soft:#e3f4f0;--ok:#1b7f4b;--warn:#a96a00;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a18;--card:#1526;--card:#152522;--text:#e4f1ee;--muted:#93aaa6;--pri:#31c2ad;--pri2:#5fd8c6;--bd:#26403b;--soft:#173630;--ok:#5fd68f;--warn:#f0b64d;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1a18;--card:#152522;--text:#e4f1ee;--muted:#93aaa6;--pri:#31c2ad;--pri2:#5fd8c6;--bd:#26403b;--soft:#173630;--ok:#5fd68f;--warn:#f0b64d;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);z-index:9}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;color:var(--pri);font-size:1.05rem;text-decoration:none}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:.9rem}
nav a:hover{background:var(--soft)}nav a.on{background:var(--pri);color:#fff}
main{max-width:1100px;margin:auto;padding:24px 16px 48px}
h1{font-size:1.8rem;margin:0 0 6px}h2{margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 20px}
.hero{background:linear-gradient(135deg,var(--pri2),var(--pri));color:#fff;border-radius:16px;padding:40px 28px;margin-bottom:22px}
.hero h1{font-size:2.1rem}.hero p{max-width:620px;opacity:.95}
.btn{display:inline-block;background:#fff;color:#0a6a5d;padding:10px 18px;border-radius:10px;font-weight:700;text-decoration:none;border:0;cursor:pointer;font-size:.95rem;margin:4px 8px 0 0}
.btn.p{background:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.card h3{margin:0 0 6px;font-size:1.02rem}.card p{margin:0;color:var(--muted);font-size:.93rem}
.stat b{display:block;font-size:1.9rem;color:var(--pri)}.stat span{color:var(--muted);font-size:.88rem}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:620px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--soft);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.tag{padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--soft)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--text);font:inherit;margin-bottom:12px}
.search{max-width:340px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row i{width:90px;font-style:normal;font-size:.88rem;color:var(--muted)}
.row div{height:14px;border-radius:7px;background:var(--pri)}
ol,ul{padding-left:20px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="#home">💊 Pradeep Online Pharmacy</a><nav id="nav"></nav></div></header>
<main id="app"></main>
<footer>© 2026 Pradeep Online Pharmacy Management System. Sample data for demonstration.</footer>
<script>
const U=[[1,"Anil Kumar","anil@mail.com","9876500011","Customer","Active"],[2,"Sita Devi","sita@mail.com","9876500012","Customer","Active"],[3,"Ravi Teja","ravi@mail.com","9876500013","Customer","Active"],[4,"Meena Rao","meena@mail.com","9876500014","Customer","Inactive"],[5,"Dr. Suresh","suresh@pradeep.in","9876500015","Pharmacist","Active"],[6,"Lakshmi N","lakshmi@pradeep.in","9876500016","Pharmacist","Active"],[7,"Pradeep Royal","admin@pradeep.in","9876500017","Admin","Active"],[8,"Kiran B","kiran@mail.com","9876500018","Customer","Active"]];
const M=[[101,"Paracetamol 500mg","Pain Relief","MedLife Pharma",25.00,240,"2027-08-15","No"],[102,"Amoxicillin 250mg","Antibiotic","CureWell Labs",96.50,80,"2027-02-10","Yes"],[103,"Cetirizine 10mg","Allergy","MedLife Pharma",32.00,150,"2027-11-01","No"],[104,"Metformin 500mg","Diabetes","HealthFirst",58.75,12,"2026-12-20","Yes"],[105,"Omeprazole 20mg","Digestive","CureWell Labs",64.00,95,"2027-05-30","No"],[106,"Atorvastatin 10mg","Cardiac","HealthFirst",120.00,8,"2027-01-18","Yes"],[107,"Vitamin C 500mg","Supplement","VitaCare",45.00,300,"2028-03-09","No"],[108,"Azithromycin 500mg","Antibiotic","CureWell Labs",110.25,60,"2027-06-22","Yes"],[109,"ORS Powder","Hydration","VitaCare",20.00,420,"2027-09-14","No"],[110,"Ibuprofen 400mg","Pain Relief","MedLife Pharma",38.00,18,"2026-11-30","No"]];
const O=[[5001,"Anil Kumar","Paracetamol, Vitamin C",160.00,"2026-11-01","Delivered","UPI"],[5002,"Sita Devi","Amoxicillin",193.00,"2026-11-02","Delivered","Card"],[5003,"Ravi Teja","Metformin x2",117.50,"2026-11-03","Shipped","COD"],[5004,"Kiran B","Cetirizine, ORS",104.00,"2026-11-04","Packed","UPI"],[5005,"Anil Kumar","Omeprazole",64.00,"2026-11-04","Placed","Card"],[5006,"Meena Rao","Ibuprofen",76.00,"2026-11-05","Cancelled","NetBanking"],[5007,"Sita Devi","Atorvastatin",120.00,"2026-11-05","Placed","UPI"],[5008,"Ravi Teja","Azithromycin",110.25,"2026-11-06","Placed","COD"]];
const P=[[9001,"Sita Devi","Dr. Ramesh","Amoxicillin 250mg","2026-11-02","Approved"],[9002,"Ravi Teja","Dr. Anitha","Metformin 500mg","2026-11-03","Approved"],[9003,"Sita Devi","Dr. Ramesh","Atorvastatin 10mg","2026-11-05","Pending"],[9004,"Ravi Teja","Dr. Anitha","Azithromycin 500mg","2026-11-06","Pending"],[9005,"Anil Kumar","Dr. Prasad","Omeprazole 20mg","2026-10-28","Approved"],[9006,"Kiran B","Dr. Prasad","Amoxicillin 250mg","2026-10-30","Rejected"]];
const cls=v=>/Active|Delivered|Approved|Paid|Yes/.test(v)?"ok":/Pending|Placed|Packed|Shipped|Admin/.test(v)?"warn":/Inactive|Cancelled|Rejected/.test(v)?"bad":"";
const tbl=(h,r,badge=[])=>`<input class="search" placeholder="Search…" oninput="flt(this)"><div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(x=>`<tr>${x.map((c,i)=>`<td>${badge.includes(i)?`<span class="tag ${cls(c)}">${c}</span>`:c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
function flt(i){const q=i.value.toLowerCase();i.nextElementSibling.querySelectorAll("tbody tr").forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?"":"none")}
const head=(t,s)=>`<h1>${t}</h1><p class="sub">${s}</p>`;
const cnt=(a,i,v)=>a.filter(x=>x[i]==v).length;
const pages={
home:["Home",()=>`<div class="hero"><h1>Pradeep Online Pharmacy Management System</h1><p>A simple, secure platform to manage medicines, customers, prescriptions, orders and payments from one place.</p><a class="btn" href="#medicines">Browse medicines</a><a class="btn p" href="#dashboard">Open dashboard</a></div>
<div class="grid"><div class="card"><h3>💊 Medicine inventory</h3><p>Track stock, prices, suppliers and expiry dates.</p></div><div class="card"><h3>🧾 Prescriptions</h3><p>Upload, review and approve prescriptions before dispatch.</p></div><div class="card"><h3>📦 Order tracking</h3><p>Follow every order from placed to delivered.</p></div><div class="card"><h3>👥 User management</h3><p>Manage customers, pharmacists and administrators.</p></div></div>`],
about:["About",()=>head("About the system","What it does and who it is for")+`<div class="card" style="margin-bottom:14px"><h2>Description</h2><p>Pradeep Online Pharmacy Management System digitises the daily work of a pharmacy. Customers can order medicines online, upload prescriptions and pay securely, while staff manage inventory, verify prescriptions and fulfil orders.</p></div>
<div class="grid"><div class="card"><h3>Key features</h3><ul><li>Medicine and stock management</li><li>Prescription verification</li><li>Order and payment tracking</li><li>Low-stock and expiry alerts</li></ul></div><div class="card"><h3>User roles</h3><ul><li>Customer: browse, order, upload</li><li>Pharmacist: verify and dispatch</li><li>Admin: users, reports, settings</li></ul></div><div class="card"><h3>How it works</h3><ol><li>Customer places an order</li><li>Pharmacist checks the prescription</li><li>Order is packed and shipped</li><li>Payment is confirmed</li></ol></div></div>`],
dashboard:["Dashboard",()=>{const st=["Placed","Packed","Shipped","Delivered","Cancelled"],rev=O.filter(o=>o[5]!="Cancelled").reduce((s,o)=>s+o[3],0),low=M.filter(m=>m[5]<20).length;
return head("Dashboard","Live overview of the pharmacy")+`<div class="grid"><div class="card stat"><b>${U.length}</b><span>Registered users</span></div><div class="card stat"><b>${M.length}</b><span>Medicines listed</span></div><div class="card stat"><b>${O.length}</b><span>Total orders</span></div><div class="card stat"><b>₹${rev.toFixed(2)}</b><span>Revenue</span></div><div class="card stat"><b class="warn">${low}</b><span>Low-stock medicines</span></div><div class="card stat"><b>${cnt(P,5,"Pending")}</b><span>Prescriptions pending</span></div></div>
<div class="card"><h2>Orders by status</h2>${st.map(s=>`<div class="row"><i>${s}</i><div style="width:${cnt(O,5,s)*40}px"></div><span>${cnt(O,5,s)}</span></div>`).join("")}</div>`}],
users:["Users",()=>head("Users","Customers, pharmacists and administrators")+tbl(["ID","Name","Email","Phone","Role","Status"],U,[4,5])],
medicines:["Medicines",()=>head("Medicines","Inventory with price, stock and expiry")+tbl(["ID","Medicine","Category","Supplier","Price (₹)","Stock","Expiry","Rx needed"],M.map(m=>[...m.slice(0,4),m[4].toFixed(2),m[5]<20?m[5]+" ⚠":m[5],m[6],m[7]]),[7])],
orders:["Orders",()=>head("Orders","All customer orders and their status")+tbl(["Order","Customer","Items","Total (₹)","Date","Status","Payment"],O.map(o=>[...o.slice(0,3),o[3].toFixed(2),...o.slice(4)]),[5])],
prescriptions:["Prescriptions",()=>head("Prescriptions","Uploaded prescriptions awaiting or after review")+tbl(["ID","Patient","Doctor","Medicine","Uploaded","Status"],P,[5])],
contact:["Contact",()=>head("Contact us","Questions about orders or medicines? Write to us.")+`<div class="grid"><div class="card"><input id="n" placeholder="Your name"><input id="e" placeholder="Email"><textarea id="m" rows="4" placeholder="Your message"></textarea><button class="btn p" onclick="sendMsg()">Send message</button><p id="ok" class="ok" style="margin-top:10px"></p></div><div class="card"><h3>Pradeep Online Pharmacy</h3><p>Email: support@pradeep.in<br>Phone: +91 98765 00017<br>Hours: Mon–Sat, 9:00 AM – 9:00 PM</p></div></div>`]};
function sendMsg(){document.getElementById("ok").textContent=document.getElementById("n").value?"Thank you, "+document.getElementById("n").value+"! We’ll reply soon.":"Please enter your name."}
function route(){const k=pages[location.hash.slice(1)]?location.hash.slice(1):"home";document.getElementById("app").innerHTML=pages[k][1]();document.getElementById("nav").innerHTML=Object.keys(pages).map(p=>`<a href="#${p}" class="${p==k?"on":""}">${pages[p][0]}</a>`).join("");scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
